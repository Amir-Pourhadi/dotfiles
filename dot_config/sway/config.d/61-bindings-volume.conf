set $volume_helper_cmd /usr/libexec/sway/volume-helper

bindsym --locked XF86AudioRaiseVolume exec \
    $volume_helper_cmd --increase 5

bindsym --locked XF86AudioLowerVolume exec \
    $volume_helper_cmd --decrease 5

bindsym --locked XF86AudioMute exec \
    pactl set-sink-mute @DEFAULT_SINK@ toggle && $volume_helper_cmd

bindsym --locked XF86AudioMicMute exec \
    pactl set-source-mute @DEFAULT_SOURCE@ toggle
