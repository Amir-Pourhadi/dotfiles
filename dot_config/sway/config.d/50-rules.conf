# Web Wokspace
assign [app_id="firefox$"] $ws_web
assign [app_id="chrome$"] $ws_web

# Picture-in-Picure Chrome
# for_window [app_id="chrome$" title="^(?!.*Google Chrome$)"] floating enable, sticky enable, resize set 330 424, move absolute position 1589 656

# Terminal Workspace
assign [app_id="ghostty$"] $ws_term

# Coding tools Workspace

# Social Media Workspace
assign [app_id="discord"] $ws_chat
assign [app_id=".*telegram"] $ws_chat
assign [app_id="teamspeak$"] $ws_chat

# Files Workspace
assign [app_id="Thunar"] $ws_files

# Multimedia Workspace
assign [app_id="mpv"] $ws_media

# Gaming Workspace
assign [class="steam"] $ws_game
for_window [class="steam" title="^(?!Steam$)"] floating enable

# Tools Workspace
assign [app_id="KeePassXC$"] $ws_tools
assign [app_id="Throne"] $ws_tools

# Scratch Workspace

# Floating Apps
for_window [app_id="pavucontrol"] floating enable, move position center
for_window [app_id="lxqt-policykit-agent"] floating enable, move position center
for_window [app_id="blueman-manager"] floating enable, move position center
for_window [app_id="nm-connection-editor"] floating enable, move position center

# Dialogs and pop-ups
for_window [window_role="pop-up"] floating enable
for_window [window_role="bubble"] floating enable
for_window [window_role="task_dialog"] floating enable
for_window [window_role="Preferences"] floating enable
for_window [window_type="dialog"] floating enable
for_window [window_type="menu"] floating enable

# File chooser dialogs (GTK portal)
for_window [app_id="xdg-desktop-portal-gtk"] floating enable, resize set 900 600, move position center

# Wayland Apps
for_window [shell="xwayland"] title_format "[X] %title"
