bindsym --to-code $mod+g mode "Go"
mode "Go" {
    bindsym --to-code w workspace $ws_web, mode "default"
    bindsym --to-code t workspace $ws_term, mode "default"
    bindsym --to-code c workspace $ws_code, mode "default"
    bindsym --to-code a workspace $ws_chat, mode "default"
    bindsym --to-code f workspace $ws_files, mode "default"
    bindsym --to-code m workspace $ws_media, mode "default"
    bindsym --to-code g workspace $ws_game, mode "default"
    bindsym --to-code o workspace $ws_tools, mode "default"
    bindsym --to-code s workspace $ws_scratch, mode "default"

    bindsym --to-code Escape mode "default"
}

bindsym --to-code $mod+o mode "Open"
mode "Open" {
    bindsym --to-code t exec $term, mode "default"
    bindsym --to-code f exec $files, mode "default"
    bindsym --to-code n exec $notes, mode "default"

    bindsym --to-code Escape mode "default"
}

bindsym --to-code $mod+m mode "Move"
mode "Move" {
    bindsym --to-code w move container to workspace $ws_web, mode "default"
    bindsym --to-code t move container to workspace $ws_term, mode "default"
    bindsym --to-code c move container to workspace $ws_code, mode "default"
    bindsym --to-code a move container to workspace $ws_chat, mode "default"
    bindsym --to-code f move container to workspace $ws_files, mode "default"
    bindsym --to-code m move container to workspace $ws_media, mode "default"
    bindsym --to-code g move container to workspace $ws_game, mode "default"
    bindsym --to-code o move container to workspace $ws_tools, mode "default"
    bindsym --to-code s move container to workspace $ws_scratch, mode "default"

    bindsym --to-code Escape mode "default"
}

bindsym --to-code $mod+w mode "Window"
mode "Window" {
    bindsym --to-code w kill, mode "default"
    bindsym --to-code f fullscreen toggle, mode "default"
    bindsym --to-code s floating toggle, mode "default"
    bindsym --to-code p move scratchpad, mode "default"
    bindsym --to-code e layout toggle split, mode "default"
    bindsym --to-code t layout tabbed, mode "default"
    bindsym --to-code k layout stacking, mode "default"

    bindsym --to-code Escape mode "default"
}

bindsym --to-code $mod+u mode "Utils"
mode "Utils" {
    bindsym --to-code n exec ~/.local/bin/update-wallpaper, mode "default"
    bindsym --to-code s exec ~/.local/bin/toggle-nsfw, mode "default"
    bindsym --to-code k exec ~/.local/bin/toggle-keyd, mode "default"

    bindsym --to-code Escape mode "default"
}

bindsym --to-code $mod+space mode "Run"
mode "Run" {
    bindsym --to-code space exec fuzzel, mode "default"
    bindsym --to-code c exec $fz/calc, mode "default"
    bindsym --to-code f exec $fz/files, mode "default"
    bindsym --to-code g exec $fz/google, mode "default"
    bindsym --to-code v exec $fz/clip, mode "default"
    bindsym --to-code w exec $fz/windows, mode "default"
    bindsym --to-code e exec $fz/emoji, mode "default"
    bindsym --to-code p exec $fz/power, mode "default"
    bindsym --to-code n exec $fz/notif, mode "default"

    bindsym --to-code Escape mode "default"
}
