exec {
    systemctl --user import-environment \
        DISPLAY \
        WAYLAND_DISPLAY \
        SWAYSOCK \
        XDG_CURRENT_DESKTOP \
        XDG_SESSION_TYPE

    dbus-update-activation-environment --systemd \
        DISPLAY \
        WAYLAND_DISPLAY \
        SWAYSOCK \
        XDG_CURRENT_DESKTOP \
        XDG_SESSION_TYPE
}
