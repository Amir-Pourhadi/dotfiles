
exec_always {
  sh -c 'pkill waybar; waybar'
  nm-applet --indicator
  blueman-applet
}

exec {
  systemctl --user start sway-session.target
  systemctl --user import-environment WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP
  systemctl --user start dunst.service
  systemctl --user restart ps4-controller.service
  swaybg -i $HOME/Pictures/Wallpapers/current -m fill
  --no-startup-id swaymsg workspace "$ws_term"
  awww-daemon
  gsettings set org.gnome.desktop.interface color-scheme prefer-dark
  wl-paste --type text --watch cliphist -max-items 500 store
}
