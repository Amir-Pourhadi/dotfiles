# Download location
dir=/home/amir/Downloads

# Resume downloads
continue=true

# Session persistence
save-session=/home/amir/.config/aria2/session
save-session-interval=60

# Performance
max-connection-per-server=8
split=8
min-split-size=20M

# Reliability
max-tries=10
retry-wait=5
timeout=60

# File allocation
file-allocation=falloc

# Use remote timestamp
remote-time=true

# Rename files if needed
auto-file-renaming=true
allow-overwrite=false

# Reduce console noise
summary-interval=10
console-log-level=warn

# Concurrent downloads
max-concurrent-downloads=3

# Piece selection
stream-piece-selector=default

# Better metadata
follow-torrent=true
follow-metalink=true
