
[main]
anchor=top
y-margin=150
use-bold=yes
match-mode=fzf
match-counter=yes
font=Inter:size=13
line-height=20
vertical-pad=12
horizontal-pad=18
inner-pad=8
icon-theme=Adwaita
layer=overlay
width=60
lines=10
prompt="󱓞   "
terminal=ghostty -e

[colors]
background=1e1e2eff
text=cdd6f4ff
prompt=bac2deff
placeholder=7f849cff
input=cdd6f4ff
match=cba6f7ff
selection=585b70ff
selection-text=cdd6f4ff
selection-match=cba6f7ff
counter=7f849cff
border=cba6f7ff

[border]
width=2
radius=8

[key-bindings]
cancel=Escape Control+g
delete-line-forward=none
prev=Up Control+k
next=Down Control+j
custom-1=Control+Return
custom-2=Mod1+Return
custom-3=Control+c
