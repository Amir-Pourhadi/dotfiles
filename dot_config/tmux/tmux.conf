# ------------- General -------------

set -g prefix M-Space
unbind C-b
bind M-Space send-prefix

set -g mouse on
set -g default-terminal "tmux-256color"
set -s set-clipboard external

# ------------- Plugins -------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_status_modules_right "directory"

run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

# ------------- Theme & Status -------------

set -g @catppuccin_window_text " #(~/.config/tmux/scripts/window-icon.sh '#W')"
set -g @catppuccin_window_current_text " #(~/.config/tmux/scripts/window-icon.sh '#W')"

set -g @catppuccin_directory_text " #(~/.config/tmux/scripts/directory.sh '#{pane_current_path}')"

set -g status-left-length 0
set -g status-left ""

set -g status-right-length 80
set -g status-right "#{E:@catppuccin_status_directory}"

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=default"

# ------------- Window Management -------------

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Window names are controlled manually.
set -g allow-rename off
setw -g automatic-rename off

set -g set-titles on
set -g set-titles-string "#S • #W"

# ------------- Pane Navigation -------------

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-Left  resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up    resize-pane -U 5
bind -n M-Down  resize-pane -D 5

# Preserve the current pane's working directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ------------- Pane Actions -------------

bind z resize-pane -Z
bind x kill-pane

bind r source-file ~/.config/tmux/tmux.conf \; display-message "TMUX Reloaded!"

# ------------- Input & Alerts -------------

set -g status-keys vi
setw -g mode-keys vi
set -sg escape-time 10

set -g visual-activity on
set -g visual-bell on
set -g bell-action none

# TPM must be started after all plugin configuration.
run '~/.config/tmux/plugins/tpm/tpm'
